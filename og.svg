<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">PMICBook — Power Management IC Technology</title>
  <desc id="desc">An interactive engineering textbook connecting power systems, circuits, devices, BCD technology, fabrication, test, and reliability.</desc>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#c2550c"/><stop offset="1" stop-color="#2f63d8"/></linearGradient>
    <linearGradient id="line" x1="0" x2="1"><stop stop-color="#c2550c"/><stop offset="1" stop-color="#2f63d8"/></linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#19253a" flood-opacity=".10"/></filter>
  </defs>
  <rect width="1200" height="630" fill="#f6f7fb"/>
  <rect x="0" y="0" width="1200" height="8" fill="url(#accent)"/>
  <circle cx="1090" cy="-18" r="250" fill="#e9eef9" opacity=".72"/>
  <circle cx="1020" cy="640" r="260" fill="#f6e8dd" opacity=".50"/>
