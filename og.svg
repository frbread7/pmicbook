    <text x="74" y="369" fill="#252f42" font-size="35" font-weight="600">IC Technology</text>
    <text x="75" y="432" fill="#566178" font-size="19">From system rails to devices, BCD, and fabrication.</text>
    <rect x="72" y="484" width="444" height="52" rx="26" fill="#fff" stroke="#d6dce8"/>
    <circle cx="99" cy="510" r="7" fill="#c2550c"/>
    <text x="119" y="517" fill="#3a455a" font-size="16" font-weight="600">25 chapters · interactive educational models</text>
  </g>
